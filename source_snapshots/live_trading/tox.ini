[tox]
min_version = 4.0
env_list = test, compile

[testenv]
base_python = {env:TOX_PYTHON:python}
package = skip

[testenv:test]
description = Run the isolated live-runtime test suite.
deps = -r {toxinidir}/requirements-dev.txt
commands = python -m pytest -m "not slow" {toxinidir}/tests

[testenv:compile]
description = Compile the live-runtime snapshot without executing application code.
commands = python -m compileall -q -x "(^|[\\\\/])(\\.git|\\.pytest_cache|\\.tox|__pycache__)([\\\\/]|$)" {toxinidir}
